<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joboffer — вхід</title>
<style>
:root {
  --background: #f7f8f7;
  --foreground: #202624;
  --card: #ffffff;
  --muted-foreground: #626b66;
  --border: #dce2de;
  --input: #849089;
  --primary: #356859;
  --primary-hover: #2c584b;
  --danger: #a23d3d;
  --danger-background: #faeeee;
  --warning: #805b20;
  --warning-background: #fbf4e7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--background);
  color: var(--foreground);
  font: 16px/24px Inter, system-ui, sans-serif;
}
.card {
  width: 100%;
  max-width: 384px;
  padding: 32px 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 20px; font-weight: 600; }
.mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--primary);
  color: #ffffff;
  font-weight: 600;
}
h1 { margin: 0 0 8px; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0 0 12px; }
.hint { font-size: 13px; line-height: 18px; color: var(--muted-foreground); }
.warning { padding: 8px 12px; border-radius: 8px; background: var(--warning-background); color: var(--warning); font-size: 13px; line-height: 18px; }
.error { padding: 8px 12px; border-radius: 8px; background: var(--danger-background); color: var(--danger); font-size: 13px; line-height: 18px; }
form { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
label { display: block; margin-bottom: 6px; font-size: 15px; line-height: 20px; font-weight: 500; }
input[type="email"], input[type="password"] {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--input);
  border-radius: 8px;
  background: var(--card);
  color: var(--foreground);
  font: inherit;
}
button {
  height: 40px;
  border: 0;
  border-radius: 8px;
  background: var(--primary);
  color: #ffffff;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
button:hover { background: var(--primary-hover); }
.divider { margin: 16px 0 12px; text-align: center; font-size: 13px; line-height: 18px; color: var(--muted-foreground); }
.button {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--foreground);
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
}
.button:hover { background: #edf2ef; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (pointer: coarse) {
  input[type="email"], input[type="password"], button, .button { height: 44px; }
}
</style>
</head>
<body>
<main class="card">
<div class="brand"><span class="mark" aria-hidden="true">j</span>joboffer</div>
$content
</main>
</body>
</html>
