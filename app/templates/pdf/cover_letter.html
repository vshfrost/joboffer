<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$name — Cover Letter</title>
<style>
  /* Та сама шапка, що в CV (cv.html), без фото; лист — одна сторінка. */
  @page { size: A4; margin: 0 48pt 54pt; }
  body { font-family: "DejaVu Sans", sans-serif; font-kerning: none; font-size: 10pt; line-height: 15pt; color: #191919; margin: 0; }
  header { margin: 0 -48pt 30pt; padding: 25pt 48pt 18pt; background: #191919; border-bottom: 4pt solid #DA9F1A; color: #fff; }
  h1 { font-size: 20.5pt; line-height: 24pt; margin: 0 0 10pt; text-transform: uppercase; }
  .contacts { font-size: 8pt; line-height: 16pt; margin: 0; }
  .contacts span { white-space: nowrap; }
  .sep { margin: 0 4pt; }
  p { margin: 0 0 10pt; }
</style>
</head>
<body>
<header>
  <h1>$name</h1>
$contacts</header>
$paragraphs</body>
