# Прод-стек joboffer (публічна адреса — JOBOFFER_WEB_PUBLIC_URL, через Cloudflare Tunnel). Запуск із кореня репо:
#   docker compose -f infra/compose.prod.yaml --env-file /etc/joboffer/env up -d --build
# Змінні — з /etc/joboffer/env (шаблон infra/.env.prod.example); файл не комітиться.
# Хост-порти лише на 127.0.0.1; назовні трафік іде тунелем cloudflared → web:8080 (без опублікованих портів).
name: joboffer

x-prod-env: &prod-env
  JOBOFFER_ENVIRONMENT: prod
  JOBOFFER_COOKIE_SECURE: "true"  # cookie __Host-joboffer_session
  JOBOFFER_DATABASE_URL: postgresql+psycopg://joboffer:${JOBOFFER_POSTGRES_PASSWORD:?задай JOBOFFER_POSTGRES_PASSWORD в /etc/joboffer/env}@postgres:5432/joboffer
  # Перед застосунком стоїть Caddy (web), перед ним Cloudflare: IP клієнта — з CF-Connecting-IP
  # (береться лише від локального peer), інакше з X-Forwarded-For.
  JOBOFFER_TRUSTED_PROXIES: "1"
  JOBOFFER_CLIENT_IP_HEADER: cf-connecting-ip
  # Origin вебу; адреса агента (resource OAuth) = цей origin + /mcp. Обовʼязкові: типових значень нема.
  JOBOFFER_WEB_PUBLIC_URL: ${JOBOFFER_WEB_PUBLIC_URL:?задай JOBOFFER_WEB_PUBLIC_URL в /etc/joboffer/env}
  JOBOFFER_AGENT_ALLOWED_HOSTS: ${JOBOFFER_AGENT_ALLOWED_HOSTS:?задай JOBOFFER_AGENT_ALLOWED_HOSTS в /etc/joboffer/env}
  JOBOFFER_MAIL_ADDRESS: ${JOBOFFER_MAIL_ADDRESS:?задай JOBOFFER_MAIL_ADDRESS в /etc/joboffer/env}
  # Вхід через Google: порожні значення = вимкнено.
  JOBOFFER_GOOGLE_CLIENT_ID: ${JOBOFFER_GOOGLE_CLIENT_ID:-}
  JOBOFFER_GOOGLE_CLIENT_SECRET: ${JOBOFFER_GOOGLE_CLIENT_SECRET:-}
  JOBOFFER_GOOGLE_REDIRECT_URI: ${JOBOFFER_GOOGLE_REDIRECT_URI:-}
  JOBOFFER_AUTH_STATE_SECRET: ${JOBOFFER_AUTH_STATE_SECRET:-}

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: joboffer
      POSTGRES_USER: joboffer
      POSTGRES_PASSWORD: ${JOBOFFER_POSTGRES_PASSWORD:?задай JOBOFFER_POSTGRES_PASSWORD в /etc/joboffer/env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joboffer -d joboffer"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    image: joboffer-app:prod
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *prod-env
      JOBOFFER_SIGNUP_MODE: invite
      JOBOFFER_ALTCHA_HMAC_KEY: ${JOBOFFER_ALTCHA_HMAC_KEY:-}
      JOBOFFER_ALTCHA_MAXNUMBER: ${JOBOFFER_ALTCHA_MAXNUMBER:-100000}
      # Відправка листів (код реєстрації): токен gmail.send є лише тут. Без токена реєстрація закрита.
      JOBOFFER_GMAIL_CLIENT_ID: ${JOBOFFER_GMAIL_CLIENT_ID:-}
      JOBOFFER_GMAIL_CLIENT_SECRET: ${JOBOFFER_GMAIL_CLIENT_SECRET:-}
      JOBOFFER_GMAIL_SEND_REFRESH_TOKEN: ${JOBOFFER_GMAIL_SEND_REFRESH_TOKEN:-}
      JOBOFFER_MAIL_SEND_DAILY_LIMIT: ${JOBOFFER_MAIL_SEND_DAILY_LIMIT:-50}
    # PDF лише читаємо (пише агент). Тека на хості: uid 10001 (користувач образу), права 0700.
    volumes:
      - ${JOBOFFER_DOCUMENTS_HOST_DIR:-/srv/joboffer/documents}:/data/documents:ro
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8797:8797"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8797/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Агент (MCP + OAuth): окремий процес на тому ж образі. Міграції застосовує `app`, тож чекаємо на нього.
  agent:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    image: joboffer-app:prod
    restart: unless-stopped
    mem_limit: 1g
    command: ["uvicorn", "--factory", "bootstrap.agent:create_agent_app", "--host", "0.0.0.0", "--port", "8798"]
    environment:
      <<: *prod-env
      # Адреса повернення логін-гейта: <origin вебу>/mcp/auth/google/callback.
      JOBOFFER_GOOGLE_GATE_REDIRECT_URI: ${JOBOFFER_GOOGLE_GATE_REDIRECT_URI:-}
    # Агент пише PDF версій документів.
    volumes:
      - ${JOBOFFER_DOCUMENTS_HOST_DIR:-/srv/joboffer/documents}:/data/documents
    depends_on:
      app: { condition: service_healthy }
    ports: ["127.0.0.1:8798:8798"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8798/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Edge: Caddy роздає SPA, /api/* веде на app, /mcp* і /.well-known/oauth-* — на agent (infra/web/Caddyfile).
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: joboffer-web:prod
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app: { condition: service_healthy }
      agent: { condition: service_healthy }
    ports: ["127.0.0.1:8799:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Cloudflare Tunnel (remotely-managed): ingress задано в дашборді Cloudflare → http://web:8080.
  # Токен тунелю — TUNNEL_TOKEN з /etc/joboffer/env. Портів не публікує.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    mem_limit: 128m
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?задай TUNNEL_TOKEN в /etc/joboffer/env}
    depends_on:
      web: { condition: service_healthy }

  # Прогін джерел вакансій: одноразовий запуск, з `up` не стартує. Секретів нема.
  #   docker compose -f infra/compose.prod.yaml --env-file /etc/joboffer/env run --rm sources
  sources:
    profiles: ["sources"]
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    image: joboffer-app:prod
    command: ["python", "-m", "bootstrap.refresh_sources"]
    restart: "no"
    mem_limit: 512m
    environment:
      JOBOFFER_ENVIRONMENT: prod
      JOBOFFER_DATABASE_URL: postgresql+psycopg://joboffer:${JOBOFFER_POSTGRES_PASSWORD:?задай JOBOFFER_POSTGRES_PASSWORD в /etc/joboffer/env}@postgres:5432/joboffer
    depends_on:
      app: { condition: service_healthy }

  # Тріаж вакансій за правилами без LLM (cron): одноразовий запуск, з `up` не стартує. Ключів API
  # і секретів нема. `--report` лише читає: порівняння з аналізами й розподіл вердиктів.
  #   docker compose -f infra/compose.prod.yaml --env-file /etc/joboffer/env --profile triage run --rm triage
  #   docker compose -f infra/compose.prod.yaml --env-file /etc/joboffer/env --profile triage run --rm triage python -m bootstrap.auto_triage --report
  triage:
    profiles: ["triage"]
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    image: joboffer-app:prod
    command: ["python", "-m", "bootstrap.auto_triage"]
    restart: "no"
    mem_limit: 512m
    environment:
      JOBOFFER_ENVIRONMENT: prod
      JOBOFFER_DATABASE_URL: postgresql+psycopg://joboffer:${JOBOFFER_POSTGRES_PASSWORD:?задай JOBOFFER_POSTGRES_PASSWORD в /etc/joboffer/env}@postgres:5432/joboffer
    depends_on:
      app: { condition: service_healthy }

  # Синк пошти (Gmail → БД): одноразовий запуск, з `up` не стартує. Gmail-доступ на читання —
  # лише з /etc/joboffer/gmail.env (root 0600, поза репо: JOBOFFER_GMAIL_CLIENT_ID / _CLIENT_SECRET /
  # _REFRESH_TOKEN); токена gmail.send тут нема. required: false — щоб `compose config` у CI
  # проходив без файлу; на сервері без файлу синк зупиниться з підказкою про потрібні змінні.
  #   docker compose -f infra/compose.prod.yaml --env-file /etc/joboffer/env --profile mail run --rm mailsync
  mailsync:
    profiles: ["mail"]
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
    image: joboffer-app:prod
    command: ["python", "-m", "bootstrap.sync_mail"]
    restart: "no"
    mem_limit: 512m
    env_file:
      - path: ${JOBOFFER_GMAIL_ENV_FILE:-/etc/joboffer/gmail.env}
        required: false
    environment:
      JOBOFFER_ENVIRONMENT: prod
      JOBOFFER_DATABASE_URL: postgresql+psycopg://joboffer:${JOBOFFER_POSTGRES_PASSWORD:?задай JOBOFFER_POSTGRES_PASSWORD в /etc/joboffer/env}@postgres:5432/joboffer
      JOBOFFER_MAIL_ADDRESS: ${JOBOFFER_MAIL_ADDRESS:?задай JOBOFFER_MAIL_ADDRESS в /etc/joboffer/env}
    depends_on:
      app: { condition: service_healthy }

volumes:
  postgres-data:
    name: joboffer-pgdata
