version: 2
updates:
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint підтримує лише typescript <6.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # cropperjs 2 має зовсім нове API; міграція — окремою задачею.
      - dependency-name: cropperjs
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    # Python 3.15 ломить `uv sync --locked` (exit 2); потрібен окремий свідомий апгрейд.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
